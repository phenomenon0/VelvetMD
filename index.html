<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VelvetMD</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --sidebar-width: 240px;
            --drag-height: 36px;
            --content-width: 720px;
            --ease: cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* ═══════════════════════════════════════════════════════════════════════
           LIGHT THEME (Natural Paper)
           ═══════════════════════════════════════════════════════════════════════ */
        .theme-light {
            --bg: #f4f1eb;
            --bg-alt: #ebe7df;
            --bg-code: rgba(120,100,80,0.06);
            --fg: #2c2825;
            --muted: #5c5650;
            --faint: #8a847a;
            --border: rgba(80,70,60,0.12);
            --accent: #8b6b4a;
            --accent-fg: #f4f1eb;
            --link: #6a5040;
            --code-fg: #7a5a3a;
            --noise-opacity: 0.03;
        }

        /* ═══════════════════════════════════════════════════════════════════════
           DARK THEME (Gwern Pure Black)
           ═══════════════════════════════════════════════════════════════════════ */
        .theme-dark {
            --bg: #0a0a09;
            --bg-alt: #111110;
            --bg-code: #050504;
            --fg: #c8c4bc;
            --muted: #7a766e;
            --faint: #4a4842;
            --border: rgba(255,255,255,0.05);
            --accent: #a08860;
            --accent-fg: #0a0a09;
            --link: #a08860;
            --code-fg: #6a9a90;
            --noise-opacity: 0.015;
        }

        /* ═══════════════════════════════════════════════════════════════════════
           DEEP NARRATIVE THEME (Warm Sepia)
           ═══════════════════════════════════════════════════════════════════════ */
        .theme-deep {
            --bg: #1a1714;
            --bg-alt: #231f1a;
            --bg-code: #12100d;
            --fg: #e0d8cc;
            --muted: #a09585;
            --faint: #6a6055;
            --border: #3a332a;
            --accent: #d4a04a;
            --accent-fg: #1a1714;
            --link: #d4a04a;
            --code-fg: #7eb090;
            --noise-opacity: 0.02;
        }

        /* ═══════════════════════════════════════════════════════════════════════
           FONT FAMILIES
           ═══════════════════════════════════════════════════════════════════════ */
        .font-system {
            --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --font-heading: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --font-mono: 'SF Mono', Consolas, monospace;
        }
        .font-serif {
            --font-body: 'Source Serif 4', Georgia, serif;
            --font-heading: 'Source Serif 4', Georgia, serif;
            --font-mono: 'JetBrains Mono', monospace;
        }
        .font-mono {
            --font-body: 'JetBrains Mono', Consolas, monospace;
            --font-heading: 'JetBrains Mono', Consolas, monospace;
            --font-mono: 'JetBrains Mono', Consolas, monospace;
        }
        .font-inter {
            --font-body: 'Inter', -apple-system, sans-serif;
            --font-heading: 'Inter', -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        /* ═══════════════════════════════════════════════════════════════════════
           SIZE PRESETS
           ═══════════════════════════════════════════════════════════════════════ */
        .size-sm {
            --font-size: 15px;
            --line-height: 1.5;
        }
        .size-md {
            --font-size: 17px;
            --line-height: 1.5;
        }
        .size-lg {
            --font-size: 19px;
            --line-height: 1.5;
        }

        /* ═══════════════════════════════════════════════════════════════════════
           BASE
           ═══════════════════════════════════════════════════════════════════════ */
        html { font-size: 16px; }

        body {
            background: var(--bg);
            color: var(--fg);
            font-family: var(--font-body);
            font-size: var(--font-size);
            line-height: var(--line-height);
            display: flex;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            position: relative;
        }

        /* Noise texture overlay */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 9999;
            opacity: var(--noise-opacity, 0.02);
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        /* ═══════════════════════════════════════════════════════════════════════
           WINDOW CHROME
           ═══════════════════════════════════════════════════════════════════════ */
        .drag-handle {
            -webkit-app-region: drag;
            height: var(--drag-height);
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
        }

        .drag-handle button, .drag-handle select { -webkit-app-region: no-drag; }

        .window-title {
            font-family: var(--font-mono);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--muted);
            margin-left: 70px;
        }

        .window-btns { display: flex; gap: 6px; }
        .window-btns button {
            width: 12px; height: 12px;
            border-radius: 50%; border: none;
            cursor: pointer;
        }
        .btn-close { background: #ff5f57; }
        .btn-min { background: #febc2e; }
        .btn-max { background: #28c840; }

        .platform-darwin .window-btns { display: none; }
        .platform-linux .window-title, .platform-win32 .window-title { margin-left: 16px; }

        /* ═══════════════════════════════════════════════════════════════════════
           SIDEBAR
           ═══════════════════════════════════════════════════════════════════════ */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--bg-alt);
            border-right: 1px solid var(--border);
            position: fixed;
            top: var(--drag-height);
            bottom: 0; left: 0;
            display: flex;
            flex-direction: column;
            z-index: 100;
        }

        .sidebar-header {
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
        }

        .app-title {
            font-family: var(--font-mono);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--muted);
        }

        .sidebar-btns { display: flex; gap: 4px; }

        .btn-icon {
            width: 26px; height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            border-radius: 4px;
            color: var(--muted);
            cursor: pointer;
        }
        .btn-icon:hover { background: var(--border); color: var(--fg); }
        .btn-icon svg { width: 14px; height: 14px; }

        .file-tree { flex: 1; overflow-y: auto; padding: 8px 0; }

        .file-tree-empty {
            padding: 24px 16px;
            text-align: center;
            color: var(--faint);
            font-size: 13px;
        }
        .file-tree-empty .hint {
            margin-top: 4px;
            font-size: 11px;
        }

        .file-item {
            display: flex;
            align-items: center;
            padding: 6px 12px;
            margin: 1px 8px;
            cursor: pointer;
            font-size: 13px;
            color: var(--muted);
            border-radius: 4px;
            transition: all 0.15s ease;
        }
        .file-item:hover { background: var(--border); color: var(--fg); }
        .file-item.active { background: var(--accent); color: var(--accent-fg); }
        .file-item.active .file-icon { opacity: 1; }
        .file-item.folder-item { color: var(--faint); font-size: 12px; }
        .file-item.folder-item:hover { color: var(--muted); }

        .file-icon {
            width: 16px; height: 16px;
            margin-right: 8px;
            opacity: 0.5;
            flex-shrink: 0;
        }
        .file-icon svg { width: 100%; height: 100%; }

        .file-name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* ═══════════════════════════════════════════════════════════════════════
           MAIN CONTENT
           ═══════════════════════════════════════════════════════════════════════ */
        .main {
            margin-left: var(--sidebar-width);
            margin-top: var(--drag-height);
            flex: 1;
            padding: 20px 32px;
            max-width: calc(var(--sidebar-width) + var(--content-width) + 64px);
        }

        .controls {
            position: sticky;
            top: var(--drag-height);
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
            padding: 8px 0;
            margin-bottom: 12px;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
        }

        .control-select {
            height: 26px;
            padding: 0 8px;
            background: var(--bg-alt);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--fg);
            font-family: var(--font-mono);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
        }
        .control-select:focus { outline: none; border-color: var(--accent); }

        .size-toggle {
            display: flex;
            border: 1px solid var(--border);
            border-radius: 4px;
            overflow: hidden;
        }
        .size-toggle button {
            height: 24px;
            padding: 0 10px;
            background: var(--bg-alt);
            border: none;
            border-right: 1px solid var(--border);
            color: var(--muted);
            font-family: var(--font-mono);
            font-size: 10px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .size-toggle button:last-child { border-right: none; }
        .size-toggle button:hover { color: var(--fg); }
        .size-toggle button.active {
            background: var(--accent);
            color: var(--accent-fg);
        }

        .sound-toggle {
            margin-left: 4px;
        }
        .sound-toggle .sound-off { display: none; }
        .sound-toggle.muted .sound-on { display: none; }
        .sound-toggle.muted .sound-off { display: block; }

        .vibrant-toggle.active {
            color: var(--accent);
        }

        /* ═══════════════════════════════════════════════════════════════════════
           VIBRANT MODE - Colorful headings, multi-font
           ═══════════════════════════════════════════════════════════════════════ */
        .vibrant .md h1 {
            background: linear-gradient(135deg, #e07050 0%, #d4a04a 50%, #7eb090 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 600;
        }
        .vibrant .md h2 {
            color: #d4a04a;
            font-family: var(--font-mono);
            text-transform: uppercase;
            font-size: 0.95em;
            letter-spacing: 0.1em;
        }
        .vibrant .md h3 {
            color: #7eb090;
            font-style: italic;
        }
        .vibrant .md h4 {
            color: #a08860;
        }
        .vibrant .md strong {
            color: #e07050;
            font-weight: 700;
        }
        .vibrant .md em {
            color: #7eb090;
        }
        .vibrant .md a {
            color: #d4a04a;
            border-bottom-color: rgba(212, 160, 74, 0.3);
        }
        .vibrant .md code {
            color: #eb4034;
            background: rgba(235, 64, 52, 0.12);
            font-weight: 500;
        }
        .vibrant .md pre {
            border-left: 3px solid #eb4034;
        }
        .vibrant .md pre code {
            color: var(--fg);
            background: none;
        }
        .vibrant .md blockquote {
            border-left-color: #d4a04a;
            background: rgba(212, 160, 74, 0.05);
        }
        .vibrant .md li::marker {
            color: #7eb090;
        }

        /* Light theme vibrant adjustments */
        .theme-light.vibrant .md h1 {
            background: linear-gradient(135deg, #c04020 0%, #a07030 50%, #408050 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .theme-light.vibrant .md h2 { color: #8a6030; }
        .theme-light.vibrant .md h3 { color: #306040; }
        .theme-light.vibrant .md strong { color: #c04020; }
        .theme-light.vibrant .md em { color: #306040; }
        .theme-light.vibrant .md a { color: #8a6030; }
        .theme-light.vibrant .md code { color: #c04020; background: rgba(192, 64, 32, 0.08); }

        /* ═══════════════════════════════════════════════════════════════════════
           MARKDOWN CONTENT
           ═══════════════════════════════════════════════════════════════════════ */
        .md {
            font-family: var(--font-body);
            font-size: var(--font-size);
            color: var(--fg);
            line-height: var(--line-height);
            max-width: var(--content-width);
        }

        .md h1, .md h2, .md h3, .md h4, .md h5, .md h6 {
            font-family: var(--font-heading);
            font-weight: 500;
            letter-spacing: -0.02em;
            color: var(--fg);
        }

        .md h1 { font-size: 1.4em; margin: 1.2em 0 0.4em; padding-bottom: 0.2em; border-bottom: 1px solid var(--border); }
        .md h2 { font-size: 1.15em; margin: 1em 0 0.3em; }
        .md h3 { font-size: 1.05em; margin: 0.8em 0 0.2em; }
        .md h4 { font-size: 0.95em; margin: 0.7em 0 0.2em; color: var(--muted); }
        .md h5, .md h6 { font-size: 0.9em; margin: 0.6em 0 0.2em; color: var(--muted); }

        .md p { margin: 0 0 0.6em; }

        .md a { color: var(--link); text-decoration: none; border-bottom: 1px solid var(--border); }
        .md a:hover { border-color: var(--link); }

        .md strong { font-weight: 600; }
        .md em { font-style: italic; }

        .md code {
            font-family: var(--font-mono);
            font-size: 0.85em;
            background: var(--bg-code);
            color: var(--code-fg);
            padding: 0.15em 0.4em;
            border-radius: 3px;
        }

        .md pre {
            background: var(--bg-alt);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 12px 16px;
            overflow-x: auto;
            margin: 0.8em 0;
            font-size: 0.85em;
            line-height: 1.45;
        }
        .md pre code { background: none; padding: 0; color: var(--fg); }

        .md blockquote {
            border-left: 3px solid var(--accent);
            margin: 0.8em 0;
            padding: 0.4em 0.8em;
            color: var(--muted);
            background: var(--bg-alt);
            font-style: italic;
        }

        .md ul, .md ol { margin: 0.5em 0; padding-left: 1.4em; }
        .md li { margin: 0.15em 0; }
        .md li::marker { color: var(--muted); }

        .md table { width: 100%; border-collapse: collapse; margin: 0.8em 0; font-size: 0.9em; }
        .md th, .md td { border: 1px solid var(--border); padding: 0.4em 0.8em; text-align: left; }
        .md th { background: var(--bg-alt); font-weight: 600; }

        .md hr { border: none; border-top: 1px solid var(--border); margin: 1.2em 0; }

        .md img { max-width: 100%; border-radius: 4px; }

        /* Deep theme extras */
        .theme-deep .md h2 {
            font-variant: small-caps;
            text-transform: lowercase;
            letter-spacing: 0.05em;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.3em;
        }

        /* ═══════════════════════════════════════════════════════════════════════
           WELCOME STATE
           ═══════════════════════════════════════════════════════════════════════ */
        .welcome {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
            text-align: center;
        }
        .welcome h1 {
            font-family: var(--font-heading);
            font-size: 2rem;
            font-weight: 400;
            color: var(--muted);
            margin-bottom: 8px;
        }
        .welcome p { color: var(--faint); font-size: 14px; margin-bottom: 24px; }
        .welcome .btn-open {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 20px;
            background: var(--accent);
            color: var(--accent-fg);
            border: none;
            border-radius: 4px;
            font-family: var(--font-mono);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
        }
        .welcome .btn-open:hover { opacity: 0.9; }
        .welcome .btn-open svg { width: 14px; height: 14px; }
        .welcome .hint {
            margin-top: 24px;
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--faint);
        }
        .welcome kbd {
            display: inline-block;
            padding: 2px 5px;
            background: var(--bg-alt);
            border: 1px solid var(--border);
            border-radius: 3px;
            font-size: 10px;
        }

        /* ═══════════════════════════════════════════════════════════════════════
           TOAST
           ═══════════════════════════════════════════════════════════════════════ */
        .toast {
            position: fixed;
            bottom: 20px; right: 20px;
            background: var(--bg-alt);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 4px;
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--muted);
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.25s var(--ease);
            z-index: 200;
        }
        .toast.visible { opacity: 1; transform: translateY(0); }

        /* ═══════════════════════════════════════════════════════════════════════
           MOBILE
           ═══════════════════════════════════════════════════════════════════════ */
        @media (max-width: 800px) {
            .sidebar { transform: translateX(-100%); transition: transform 0.3s var(--ease); }
            .sidebar.open { transform: translateX(0); }
            .main { margin-left: 0; padding: 12px 16px; }
            .mobile-menu { display: flex !important; }
            .controls { gap: 4px; flex-wrap: wrap; }
            .control-select { font-size: 9px; padding: 0 6px; }
            .size-toggle button { padding: 0 8px; }
        }
        .mobile-menu { display: none; }
    </style>
</head>
<body class="theme-dark font-serif size-md">
    <!-- SVG Icons (inline defs) -->
    <svg style="display:none">
        <defs>
            <symbol id="icon-doc" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M4 2h5l4 4v8a1 1 0 01-1 1H4a1 1 0 01-1-1V3a1 1 0 011-1z"/>
                <path d="M9 2v4h4"/>
            </symbol>
            <symbol id="icon-folder" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M2 4h4l2 2h6v7H2V4z"/>
            </symbol>
            <symbol id="icon-refresh" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M14 8a6 6 0 11-1.5-4M14 2v4h-4"/>
            </symbol>
            <symbol id="icon-menu" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M2 4h12M2 8h12M2 12h12"/>
            </symbol>
            <symbol id="icon-sound-on" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M3 5.5h2l3-2.5v10l-3-2.5H3a1 1 0 01-1-1v-3a1 1 0 011-1z"/>
                <path d="M11 5.5a3.5 3.5 0 010 5M13 3.5a6 6 0 010 9"/>
            </symbol>
            <symbol id="icon-sound-off" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M3 5.5h2l3-2.5v10l-3-2.5H3a1 1 0 01-1-1v-3a1 1 0 011-1z"/>
                <path d="M11 6l4 4M15 6l-4 4"/>
            </symbol>
            <symbol id="icon-palette" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
                <circle cx="8" cy="8" r="6"/>
                <circle cx="6" cy="6" r="1.2" fill="currentColor"/>
                <circle cx="10" cy="6" r="1.2" fill="currentColor"/>
                <circle cx="5" cy="9" r="1.2" fill="currentColor"/>
                <circle cx="9.5" cy="9.5" r="1.5" fill="currentColor"/>
            </symbol>
        </defs>
    </svg>

    <!-- Window drag handle -->
    <div class="drag-handle">
        <span class="window-title" id="window-title">VelvetMD</span>
        <div class="window-btns">
            <button class="btn-min" onclick="velvetAPI?.windowControls.minimize()"></button>
            <button class="btn-max" onclick="velvetAPI?.windowControls.maximize()"></button>
            <button class="btn-close" onclick="playClose(); setTimeout(() => velvetAPI?.windowControls.close(), 200)"></button>
        </div>
    </div>

    <!-- Sidebar -->
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span class="app-title">Files</span>
            <div class="sidebar-btns">
                <button class="btn-icon" onclick="openFolder()" title="Open folder">
                    <svg><use href="#icon-folder"/></svg>
                </button>
                <button class="btn-icon" onclick="refreshAll()" title="Refresh">
                    <svg><use href="#icon-refresh"/></svg>
                </button>
            </div>
        </div>
        <div class="file-tree" id="file-tree">
            <div class="file-tree-empty">
                <div>No folder open</div>
                <div class="hint">Open a folder to browse</div>
            </div>
        </div>
    </nav>

    <!-- Main content -->
    <main class="main" id="main">
        <div class="controls">
            <button class="btn-icon mobile-menu" onclick="toggleSidebar()">
                <svg><use href="#icon-menu"/></svg>
            </button>
            <select class="control-select" id="theme-select" onchange="changeTheme(this.value)">
                <option value="dark">Dark</option>
                <option value="light">Light</option>
                <option value="deep">Deep</option>
            </select>
            <select class="control-select" id="font-select" onchange="changeFont(this.value)">
                <option value="serif">Serif</option>
                <option value="system">System</option>
                <option value="inter">Inter</option>
                <option value="mono">Mono</option>
            </select>
            <div class="size-toggle" id="size-toggle">
                <button data-size="sm" onclick="changeSize('sm')">S</button>
                <button data-size="md" onclick="changeSize('md')" class="active">M</button>
                <button data-size="lg" onclick="changeSize('lg')">L</button>
            </div>
            <button class="btn-icon sound-toggle" id="sound-toggle" onclick="toggleSound()" title="Toggle sound">
                <svg class="sound-on"><use href="#icon-sound-on"/></svg>
                <svg class="sound-off"><use href="#icon-sound-off"/></svg>
            </button>
            <button class="btn-icon vibrant-toggle" id="vibrant-toggle" onclick="toggleVibrant()" title="Colorful mode">
                <svg><use href="#icon-palette"/></svg>
            </button>
        </div>

        <div id="content">
            <div class="welcome" id="welcome">
                <h1>VelvetMD</h1>
                <p>Markdown reader</p>
                <button class="btn-open" onclick="openFolder()">
                    <svg><use href="#icon-folder"/></svg>
                    Open Folder
                </button>
                <div class="hint"><kbd>Cmd</kbd>+<kbd>O</kbd> open folder</div>
            </div>
        </div>
    </main>

    <div class="toast" id="toast"></div>

    <script>
        let currentDir = null;
        let currentFile = null;
        let unwatchFn = null;
        let viewMode = 'browse';
        let soundEnabled = true;
        let audioCtx = null;

        // Web Audio API sound system
        function getAudioContext() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            return audioCtx;
        }

        function playTone(freq, duration, type = 'sine', volume = 0.15) {
            if (!soundEnabled) return;
            try {
                const ctx = getAudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, ctx.currentTime);
                gain.gain.setValueAtTime(volume, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + duration);
            } catch (e) {}
        }

        function playFileSelect() {
            playTone(880, 0.08, 'sine', 0.1);
            setTimeout(() => playTone(1100, 0.06, 'sine', 0.08), 50);
        }

        function playScrollEnd() {
            playTone(440, 0.15, 'triangle', 0.08);
        }

        function playClose() {
            playTone(660, 0.1, 'sine', 0.1);
            setTimeout(() => playTone(440, 0.15, 'sine', 0.08), 80);
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            localStorage.setItem('velvetmd-sound', soundEnabled ? 'on' : 'off');
            document.getElementById('sound-toggle').classList.toggle('muted', !soundEnabled);
            if (soundEnabled) playTone(880, 0.05, 'sine', 0.1);
        }

        let vibrantEnabled = false;
        function toggleVibrant() {
            vibrantEnabled = !vibrantEnabled;
            localStorage.setItem('velvetmd-vibrant', vibrantEnabled ? 'on' : 'off');
            document.body.classList.toggle('vibrant', vibrantEnabled);
            document.getElementById('vibrant-toggle').classList.toggle('active', vibrantEnabled);
            playTone(vibrantEnabled ? 660 : 440, 0.08, 'sine', 0.08);
        }

        function detectPlatform() {
            const p = navigator.platform.toLowerCase();
            if (p.includes('mac')) return 'darwin';
            if (p.includes('win')) return 'win32';
            return 'linux';
        }

        document.addEventListener('DOMContentLoaded', async () => {
            document.body.classList.add('platform-' + detectPlatform());

            // Restore preferences
            const savedTheme = localStorage.getItem('velvetmd-theme') || 'dark';
            const savedFont = localStorage.getItem('velvetmd-font') || 'serif';
            const savedSize = localStorage.getItem('velvetmd-size') || 'md';
            const savedSound = localStorage.getItem('velvetmd-sound') || 'on';

            document.getElementById('theme-select').value = savedTheme;
            document.getElementById('font-select').value = savedFont;

            changeTheme(savedTheme, true);
            changeFont(savedFont, true);
            changeSize(savedSize, true);

            // Restore sound preference
            soundEnabled = savedSound === 'on';
            document.getElementById('sound-toggle').classList.toggle('muted', !soundEnabled);

            // Restore vibrant preference
            const savedVibrant = localStorage.getItem('velvetmd-vibrant') || 'off';
            vibrantEnabled = savedVibrant === 'on';
            document.body.classList.toggle('vibrant', vibrantEnabled);
            document.getElementById('vibrant-toggle').classList.toggle('active', vibrantEnabled);

            // Scroll end detection
            let scrollTimeout;
            let lastScrollTop = 0;
            window.addEventListener('scroll', () => {
                clearTimeout(scrollTimeout);
                scrollTimeout = setTimeout(() => {
                    const scrollTop = window.scrollY;
                    const scrollHeight = document.documentElement.scrollHeight;
                    const clientHeight = window.innerHeight;
                    const atBottom = scrollTop + clientHeight >= scrollHeight - 5;
                    const atTop = scrollTop <= 5;
                    if ((atBottom || atTop) && Math.abs(scrollTop - lastScrollTop) > 50) {
                        playScrollEnd();
                    }
                    lastScrollTop = scrollTop;
                }, 150);
            });

            // Check initial file
            if (typeof velvetAPI !== 'undefined') {
                const init = await velvetAPI.getInitialFile();
                if (init) {
                    if (init.mode === 'session') {
                        viewMode = 'session';
                        await loadSessionFiles();
                    } else {
                        viewMode = 'browse';
                        if (init.directory) await loadDirectory(init.directory);
                        if (init.path) await loadFile(init.path);
                    }
                }
            }

            // Keyboard shortcuts
            document.addEventListener('keydown', e => {
                if ((e.metaKey || e.ctrlKey) && e.key === 'o') {
                    e.preventDefault();
                    openFolder();
                }
            });
        });

        async function openFolder() {
            if (typeof velvetAPI === 'undefined') return toast('Electron API unavailable');
            const dir = await velvetAPI.openFolder();
            if (dir) await loadDirectory(dir);
        }

        async function loadDirectory(dir) {
            currentDir = dir;
            viewMode = 'browse';
            if (unwatchFn) unwatchFn();
            unwatchFn = velvetAPI.watchDirectory(dir, handleChange);
            await refreshFileTree();
        }

        async function loadSessionFiles() {
            if (typeof velvetAPI === 'undefined') return;
            const files = await velvetAPI.getSessionFiles();
            renderFileList(files);
            if (unwatchFn) unwatchFn();
            unwatchFn = velvetAPI.watchSessionFiles(handleChange);
            if (files.length > 0) await loadFile(files[0].path);
            document.querySelector('.app-title').textContent = 'Session';
        }

        function handleChange(data) {
            if (data.type === 'change' && data.path === currentFile) loadFile(data.path);
            else refreshAll();
        }

        async function refreshAll() {
            if (viewMode === 'session') await loadSessionFiles();
            else await refreshFileTree();
        }

        async function refreshFileTree() {
            if (!currentDir || typeof velvetAPI === 'undefined') return;
            const files = await velvetAPI.readDirectory(currentDir);
            renderFileList(files);
        }

        function renderFileList(files) {
            const tree = document.getElementById('file-tree');
            if (!files.length) {
                tree.innerHTML = '<div class="file-tree-empty"><div>No markdown files</div><div class="hint">Add .md files</div></div>';
                return;
            }

            let html = '';

            // Add parent folder navigation if not at root
            if (currentDir && currentDir !== '/') {
                const parent = currentDir.replace(/\/[^\/]+\/?$/, '') || '/';
                html += `<div class="file-item folder-item" onclick="navigateToFolder('${parent.replace(/'/g, "\\'")}')">
                    <span class="file-icon"><svg><use href="#icon-folder"/></svg></span>
                    <span class="file-name">..</span>
                </div>`;
            }

            html += files.map(f => {
                if (f.isFolder) {
                    return `<div class="file-item folder-item" onclick="navigateToFolder('${f.path.replace(/'/g, "\\'")}')" data-path="${f.path}">
                        <span class="file-icon"><svg><use href="#icon-folder"/></svg></span>
                        <span class="file-name">${f.name}</span>
                    </div>`;
                } else {
                    const active = f.path === currentFile ? 'active' : '';
                    const name = f.name.replace('.md', '');
                    return `<div class="file-item ${active}" onclick="loadFile('${f.path.replace(/'/g, "\\'")}')" data-path="${f.path}">
                        <span class="file-icon"><svg><use href="#icon-doc"/></svg></span>
                        <span class="file-name">${name}</span>
                    </div>`;
                }
            }).join('');

            tree.innerHTML = html;
        }

        async function navigateToFolder(path) {
            playFileSelect();
            await loadDirectory(path);
        }

        async function loadFile(path) {
            if (typeof velvetAPI === 'undefined') return;
            const res = await velvetAPI.readFile(path);
            if (!res.success) return toast('Failed to load');

            if (currentFile !== path) playFileSelect();
            currentFile = path;
            document.querySelectorAll('.file-item').forEach(el => {
                el.classList.toggle('active', el.dataset.path === path);
            });
            document.getElementById('window-title').textContent = res.name;
            renderMarkdown(res.content);
        }

        function renderMarkdown(content) {
            const el = document.getElementById('welcome');
            if (el) el.style.display = 'none';
            document.getElementById('content').innerHTML = `<div class="md">${marked.parse(content)}</div>`;
        }

        function changeTheme(id, silent) {
            document.body.className = document.body.className.replace(/theme-\w+/g, '');
            document.body.classList.add('theme-' + id);
            // Re-add other classes
            const font = localStorage.getItem('velvetmd-font') || 'serif';
            const size = localStorage.getItem('velvetmd-size') || 'md';
            document.body.classList.add('font-' + font, 'size-' + size, 'platform-' + detectPlatform());
            localStorage.setItem('velvetmd-theme', id);
            if (!silent) toast('Theme: ' + id);
        }

        function changeFont(id, silent) {
            document.body.className = document.body.className.replace(/font-\w+/g, '');
            document.body.classList.add('font-' + id);
            localStorage.setItem('velvetmd-font', id);
            if (!silent) toast('Font: ' + id);
        }

        function changeSize(id, silent) {
            document.body.className = document.body.className.replace(/size-\w+/g, '');
            document.body.classList.add('size-' + id);
            localStorage.setItem('velvetmd-size', id);
            // Update toggle buttons
            document.querySelectorAll('.size-toggle button').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.size === id);
            });
            if (!silent) toast('Size: ' + id.toUpperCase());
        }

        function toast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('visible');
            setTimeout(() => t.classList.remove('visible'), 2000);
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }
    </script>
</body>
</html>
